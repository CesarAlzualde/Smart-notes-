
services:

  # Aplicación principal
  app:
    build: 
      context: .
      dockerfile: Dockerfile # Ruta al Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - uploads:/app/uploads
    environment:
      - DB_URL=postgresql://apuntes_user:password123@db:5432/apuntes_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - PORT=8000
    depends_on:
      - db
      - neo4j
    restart: unless-stopped

  # Base de datos PostgreSQL
  db:
    image: postgres:13
    environment:
      - POSTGRES_USER=apuntes_user
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=apuntes_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Base de datos de grafos Neo4j
  neo4j:
    image: neo4j:5.14.0
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
    ports:
      - "7474:7474"  # Interfaz web
      - "7687:7687"  # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
    restart: unless-stopped

  # Broker de mensajes Redis para Celery
  redis:
    image: redis:6.2-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Nginx como proxy inverso (opcional, descomentar si es necesario)
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf
  #   depends_on:
  #     - app
  #   restart: unless-stopped

# Volúmenes para persistencia de datos
volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  uploads:
  redis_data: